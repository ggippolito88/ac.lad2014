<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Academy Ladispoli — Esordienti 2° anno 2014</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#10214A;
  --navy-deep:#0A1730;
  --navy-mid:#1B3266;
  --red:#C81E2D;
  --red-deep:#9E1622;
  --white:#FFFFFF;
  --paper:#F3F4F7;
  --paper-2:#E7E9EF;
  --ink:#10214A;
  --ink-soft:#51607E;
  --line:#D6DAE4;
  --shadow: 0 2px 10px rgba(16,33,74,0.08);
}
*{box-sizing:border-box;}
body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
.app{max-width:960px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}

/* ---- Header ---- */
.topbar{background:var(--navy-deep);color:var(--white);padding:16px 20px 0;position:relative;overflow:hidden;}
.topbar::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg, var(--navy-deep) 0%, var(--navy) 140%);}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg, var(--red) 0 33%, var(--white) 33% 66%, var(--navy-mid) 66% 100%);}
.topbar-row{display:flex;align-items:center;gap:12px;position:relative;z-index:1;padding-bottom:14px;}
.logo-img{width:44px;height:44px;object-fit:contain;flex-shrink:0;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.3));}
.brand{flex:1;min-width:0;}
.brand-mark{font-family:'Archivo Black',sans-serif;font-size:16px;letter-spacing:0.3px;line-height:1.15;}
.brand-sub{font-family:'Oswald',sans-serif;font-size:10.5px;letter-spacing:1.8px;text-transform:uppercase;color:#8FA1D4;margin-top:2px;}
.header-actions{display:flex;gap:8px;flex-shrink:0;}
.icon-btn{background:transparent;border:1px solid rgba(255,255,255,0.25);color:rgba(255,255,255,0.75);font-family:'Oswald',sans-serif;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;padding:6px 10px;border-radius:3px;cursor:pointer;white-space:nowrap;}
.icon-btn:hover{border-color:rgba(255,255,255,0.6);color:var(--white);}

.tabs{display:flex;gap:2px;background:var(--navy-deep);padding:0 20px;position:relative;z-index:1;overflow-x:auto;}
.tab{font-family:'Oswald',sans-serif;font-size:12.5px;letter-spacing:1.2px;text-transform:uppercase;color:rgba(255,255,255,0.55);background:transparent;border:none;padding:12px 14px 10px;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;}
.tab.active{color:var(--white);border-bottom-color:var(--red);}
.tab:hover:not(.active){color:rgba(255,255,255,0.85);}

main{flex:1;padding:20px;}

/* ---- shared ---- */
h2.section-title{font-family:'Archivo Black',sans-serif;font-size:19px;margin:0 0 4px;color:var(--navy);}
.section-sub{font-family:'Oswald',sans-serif;font-size:11.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-soft);margin:0 0 16px;}
.card{background:var(--white);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);}
.btn{font-family:'Oswald',sans-serif;font-size:12.5px;letter-spacing:1px;text-transform:uppercase;border-radius:4px;border:none;padding:10px 16px;cursor:pointer;transition:transform .06s ease;}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--navy);color:var(--white);}
.btn-primary:hover{background:var(--navy-mid);}
.btn-accent{background:var(--red);color:var(--white);}
.btn-accent:hover{background:var(--red-deep);}
.btn-ghost{background:transparent;color:var(--navy);border:1px solid var(--line);}
.btn-ghost:hover{border-color:var(--navy);}
.btn-danger{background:transparent;color:var(--red);border:1px solid rgba(200,30,45,0.35);}
.btn-danger:hover{background:rgba(200,30,45,0.08);}
.btn-sm{padding:6px 10px;font-size:11px;}
input,select,textarea{font-family:'Inter',sans-serif;font-size:14px;color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:9px 11px;background:var(--white);width:100%;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--navy);}
label{font-family:'Oswald',sans-serif;font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-soft);display:block;margin-bottom:5px;}
.field{margin-bottom:12px;}
.row{display:flex;gap:10px;}
.row > .field{flex:1;}
.num{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;}
.empty{padding:36px 20px;text-align:center;color:var(--ink-soft);font-size:14px;}
.badge{display:inline-flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-weight:700;width:30px;height:30px;border-radius:50%;background:var(--paper-2);color:var(--navy);font-size:13px;flex-shrink:0;border:1.5px solid var(--line);}
.badge.group-A{border-color:var(--navy);color:var(--navy);}
.badge.group-B{border-color:var(--red);color:var(--red);}
.badge.group-{border-style:dashed;}
.tag{font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:3px 8px;border-radius:20px;background:var(--paper-2);color:var(--ink-soft);}
.tag.group-A{background:rgba(16,33,74,0.10);color:var(--navy);}
.tag.group-B{background:rgba(200,30,45,0.10);color:var(--red);}
.role-tag{font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:0.5px;color:var(--ink-soft);}
.divider{height:1px;background:var(--line);margin:0;}
.fab-row{display:flex;justify-content:flex-end;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.modal-backdrop{position:fixed;inset:0;background:rgba(10,23,48,0.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
.modal{background:var(--white);border-radius:8px;padding:22px;max-width:440px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 12px 40px rgba(0,0,0,0.3);}
.modal h3{font-family:'Archivo Black',sans-serif;font-size:16px;margin:0 0 16px;color:var(--navy);}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy-deep);color:var(--white);font-family:'Oswald',sans-serif;font-size:12.5px;letter-spacing:0.8px;padding:10px 18px;border-radius:5px;z-index:60;opacity:0;pointer-events:none;transition:opacity .25s ease;}
.toast.show{opacity:1;}

/* ---- Login ---- */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy-deep);position:relative;overflow:hidden;padding:20px;}
.login-wrap::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg, var(--navy-deep) 0%, var(--navy) 100%);}
.login-card{position:relative;z-index:1;background:var(--paper);border-radius:10px;padding:34px 30px;max-width:360px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.4);text-align:center;}
.login-logo{width:76px;height:76px;object-fit:contain;margin:0 auto 14px;display:block;}
.login-mark{font-family:'Archivo Black',sans-serif;font-size:17px;color:var(--navy);line-height:1.25;}
.login-sub{font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:2.2px;text-transform:uppercase;color:var(--red);margin:6px 0 24px;}
.login-error{color:var(--red);font-size:12.5px;margin-top:8px;font-family:'Oswald',sans-serif;letter-spacing:0.4px;}
.login-hint{font-size:12px;color:var(--ink-soft);margin-top:14px;line-height:1.5;}

/* ---- Roster ---- */
.player-row{display:flex;align-items:center;gap:12px;padding:12px 14px;}
.player-name{font-weight:600;font-size:14.5px;}
.player-meta{display:flex;gap:6px;align-items:center;margin-top:3px;flex-wrap:wrap;}
.player-actions{margin-left:auto;display:flex;gap:6px;flex-shrink:0;}
.group-toggle{display:flex;gap:6px;margin-bottom:16px;}
.group-toggle button{flex:1;}
.group-switch-btn{font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:0.5px;text-transform:uppercase;background:transparent;border:1px dashed var(--line);color:var(--ink-soft);border-radius:20px;padding:2px 8px;cursor:pointer;}
.group-switch-btn:hover{border-color:var(--navy);color:var(--navy);}

/* ---- Matches list ---- */
.match-row{display:flex;align-items:center;gap:14px;padding:14px;cursor:pointer;}
.match-row:hover{background:var(--paper-2);}
.match-date{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-soft);width:64px;flex-shrink:0;}
.match-opp{font-weight:600;font-size:14.5px;flex:1;}
.match-score{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:16px;color:var(--navy);}
.status-pill{font-family:'Oswald',sans-serif;font-size:9.5px;letter-spacing:1px;text-transform:uppercase;padding:3px 8px;border-radius:20px;}
.status-programmata{background:var(--paper-2);color:var(--ink-soft);}
.status-in-corso{background:rgba(200,30,45,0.14);color:var(--red);}
.status-conclusa{background:rgba(16,33,74,0.10);color:var(--navy);}

/* ---- Match detail ---- */
.back-link{font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-soft);cursor:pointer;display:inline-block;margin-bottom:14px;}
.back-link:hover{color:var(--navy);}
.match-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.score-editor{display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;}
.score-editor input{width:44px;text-align:center;font-weight:700;font-size:16px;padding:6px;}
.field-panel{padding:16px;}
.lineup-row{display:flex;align-items:center;gap:10px;padding:10px 14px;}
.lineup-min-input{width:64px;text-align:center;flex-shrink:0;}
.goal-btn{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--red);background:var(--white);color:var(--red);cursor:pointer;font-size:15px;flex-shrink:0;}
.goal-btn:hover{background:rgba(200,30,45,0.08);}
.goal-list-item{display:flex;align-items:center;gap:10px;padding:8px 14px;font-size:13.5px;}
.goal-list-item .num{color:var(--ink-soft);}
.chip-select{display:flex;flex-wrap:wrap;gap:7px;}
.chip{font-family:'Oswald',sans-serif;font-size:11.5px;letter-spacing:0.5px;padding:7px 12px;border-radius:20px;border:1.5px solid var(--line);background:var(--white);cursor:pointer;}
.chip.selected{background:var(--navy);border-color:var(--navy);color:var(--white);}

/* ---- Stats ---- */
.player-stat-block{padding:14px;}
.player-stat-block + .player-stat-block{border-top:1px solid var(--line);}
.player-stat-head{display:flex;align-items:center;gap:10px;margin-bottom:2px;}
.player-stat-totals{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--ink-soft);margin-left:auto;text-align:right;}
.match-history-item{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-soft);padding:4px 0 4px 42px;}
.match-history-item .num{font-family:'JetBrains Mono',monospace;color:var(--navy);}
.stat-toggle{background:transparent;border:none;color:var(--navy);font-family:'Oswald',sans-serif;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;padding:4px 0 0 42px;}

/* ---- Notes ---- */
textarea.notes-area{min-height:120px;resize:vertical;line-height:1.5;font-size:14px;}

@media (max-width:520px){
  .topbar{padding:14px 14px 0;}
  .tabs{padding:0 14px;}
  main{padding:14px;}
  .match-header{align-items:flex-start;}
  .brand-mark{font-size:14px;}
}
</style>
</head>

const ROLE_ORDER = { 'Portiere':0, 'Difensore':1, 'Centrocampista':2, 'Attaccante':3, '':4 };
function comparePlayers(a,b){
  const ra = ROLE_ORDER[a.role||''] ?? 4;
  const rb = ROLE_ORDER[b.role||''] ?? 4;
  if(ra !== rb) return ra - rb;
  return (a.number||99) - (b.number||99);
}

function showToast(msg){
  const t = document.getElementById('toast');
  if(!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
}

const GIST_ID = "04da13b46c77f17775bdfa266c7e063b";
const GIST_FILENAME = "gistfile1.txt";

const GIST_API_URL = "https://api.github.com/gists/" + GIST_ID;

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

async function fetchCloudData(){
  try{
    const res = await fetch(GIST_API_URL, {
      headers: {
        'Authorization': 'token ' + GITHUB_TOKEN,
        'Accept': 'application/vnd.github+json'
      }
    });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    const file = json.files && json.files[GIST_FILENAME];
    const raw = file ? file.content : '{}';
    let data = {};
    try{ data = JSON.parse(raw || '{}'); }catch(e){ data = {}; }
    return {
      authPassword: data.authPassword || null,
      roster: Array.isArray(data.roster) ? data.roster : [],
      matches: Array.isArray(data.matches) ? data.matches : [],
    };
  }catch(e){
    console.error('fetchCloudData failed', e);
    return null;
  }
}

        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ files: { [GIST_FILENAME]: { content: JSON.stringify(dataObj, null, 2) } } })
    });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    return true;
  }catch(e){
    console.error('pushCloudData failed (attempt '+attempt+')', e);
    if(attempt < 3){
      await sleep(600 * attempt);
      return pushCloudData(dataObj, attempt+1);
    }
    showToast('Salvataggio non riuscito: controlla la connessione e riprova');
    return false;
  }
}

function currentCloudSnapshot(){
  return { authPassword: state.password, roster: state.roster, matches: state.matches };
}

async function saveRoster(){ await pushCloudData(currentCloudSnapshot()); }
async function saveMatches(){ await pushCloudData(currentCloudSnapshot()); }

async function checkAuth(){
  const data = await fetchCloudData();
  if(data === null){
    state.authChecked = true;
    state.loadError = true;
    render();
    return;
  }
  state.password = data.authPassword;
  state.roster = data.roster;
  state.matches = data.matches;
  state.loginMode = state.password ? 'enter' : 'set';
  state.authChecked = true;
  state.loadError = false;
  render();
}

async function handleLoginSubmit(){
  const val = state.loginInput.trim();
  if(!val){ state.loginError = 'Inserisci una password.'; render(); return; }
  if(state.loginMode === 'set'){
    if(val.length < 4){ state.loginError = 'Usa almeno 4 caratteri.'; render(); return; }
    state.password = val;
    const ok = await pushCloudData(currentCloudSnapshot());
    if(!ok){ state.loginError = 'Errore di connessione. Riprova.'; render(); return; }
    state.authed = true;
    render();
    startPolling();
  } else {
    if(val === state.password){
      state.authed = true;
      render();
      startPolling();
    } else {
      state.loginError = 'Password errata.';
      render();
    }
  }
}

function logout(){ state.authed = false; state.loginInput=''; state.loginError=''; render(); }

/* ---------- Backup export ---------- */
function exportBackup(){
  const data = { exportedAt: new Date().toISOString(), roster: state.roster, matches: state.matches };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'academy-ladispoli-backup-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Backup scaricato');
}

/* ---------- Polling for multi-user sync ---------- */
function isEditingNow(){
  if(state.modal) return true;
  const el = document.activeElement;
  if(!el) return false;
  const tag = el.tagName;
  return tag==='INPUT' || tag==='TEXTAREA' || tag==='SELECT';
}
function startPolling(){
  if(window.__pollTimer) return;
  window.__pollTimer = setInterval(async ()=>{
    if(!state.authed || isEditingNow()) return;
    const data = await fetchCloudData();
    if(data){
      state.password = data.authPassword;
      state.roster = data.roster;
      state.matches = data.matches;
      render();
    }
  }, 7000);
}

/* ---------- Goals / helpers ---------- */
async function addGoal(matchId, playerId){
  const match = state.matches.find(m=>m.id===matchId);
  if(!match) return;
  if(!match.goals) match.goals = [];
  match.goals.push({id:uid(), playerId, minute:null});
  match.ourScore = (match.ourScore||0) + 1;
  await saveMatches();
  showToast('Gol registrato');
  render();
}
async function removeGoal(matchId, goalId){
  const match = state.matches.find(m=>m.id===matchId);
  if(!match) return;
  const idx = match.goals.findIndex(g=>g.id===goalId);
  if(idx>-1){
    match.goals.splice(idx,1);
    match.ourScore = Math.max(0,(match.ourScore||0) - 1);
  }
  await saveMatches();
  render();
}
async function setGoalMinute(matchId, goalId, minuteStr){
  const match = state.matches.find(m=>m.id===matchId);
  if(!match) return;
  const g = match.goals.find(x=>x.id===goalId);
  if(!g) return;
  const val = parseInt(minuteStr,10);
  g.minute = isNaN(val) ? null : val;
  await saveMatches();
}
async function setPlayerMinutes(matchId, playerId, minutesStr){
  const match = state.matches.find(m=>m.id===matchId);
  if(!match) return;
  if(!match.minutes) match.minutes = {};
  const val = parseInt(minutesStr,10);
  match.minutes[playerId] = isNaN(val) ? 0 : val;
  await saveMatches();
}

  root.innerHTML = `
    <div class="app">
      <div class="topbar">
        <div class="topbar-row">
          <img src="${LOGO_SRC}" class="logo-img" alt="Logo Academy Ladispoli">
          <div class="brand">

            <div class="brand-sub">Esordienti 2° anno 2014</div>

function renderStats(){
  const byPlayer = {};
  state.roster.forEach(p=> byPlayer[p.id] = {player:p, matches:[], totMin:0, totGol:0, totPresenze:0});
  state.matches.forEach(m=>{
    (m.convocati||[]).forEach(pid=>{
      if(!byPlayer[pid]) return;
      const mins = (m.minutes||{})[pid] || 0;
      const gol = (m.goals||[]).filter(g=>g.playerId===pid).length;
      byPlayer[pid].matches.push({opponent:m.opponent, date:m.date, group:m.group, minutes:mins, goals:gol});
      byPlayer[pid].totMin += mins;
      byPlayer[pid].totGol += gol;
      byPlayer[pid].totPresenze += 1;
    });
  });
  const list = Object.values(byPlayer).sort((a,b)=> b.totMin - a.totMin);
  const blocks = list.map(entry=>{
    const p = entry.player;
    const expanded = state.expandedStatPlayer === p.id;
    const historyRows = entry.matches.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(h=>`
      <div class="match-history-item">
        <span class="tag group-${h.group}">${h.group}</span>
        vs ${escapeHtml(h.opponent||'—')} · ${fmtDateShort(h.date)} ·
        <span class="num">${h.minutes}'</span> ${h.goals? `· <span class="num">${h.goals} gol</span>`:''}
      </div>
    `).join('') || `<div class="match-history-item">Nessuna partita registrata.</div>`;
    return `
      <div class="player-stat-block">
        <div class="player-stat-head">
          <div class="badge group-${p.group}" style="width:26px;height:26px;font-size:11px;">${p.number??'–'}</div>
          <div>
            <div class="player-name" style="font-size:14px;">${escapeHtml(p.name)}</div>
            ${p.role? `<div class="role-tag">${escapeHtml(roleLabel(p))}</div>`:''}
          </div>
          <div class="player-stat-totals">${entry.totPresenze} presenze · ${entry.totMin}' · ${entry.totGol} gol</div>
        </div>
        <button class="stat-toggle" data-toggle-stat="${p.id}">${expanded? 'Nascondi storico ▲' : 'Mostra storico partite ▼'}</button>
        ${expanded? historyRows : ''}
      </div>
    `;
  }).join('');
  return `
    <h2 class="section-title">Statistiche</h2>
    <div class="section-sub">${state.matches.length} partite registrate in totale · storico per giocatore</div>
    <div class="card">${blocks || `<div class="empty">Nessun dato ancora.</div>`}</div>
  `;
}

function escapeHtml(s){
  return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDateShort(d){
  if(!d) return '—';
  const dt = new Date(d+'T00:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('it-IT',{day:'2-digit',month:'short'});
}
function fmtDateLong(d){
  if(!d) return '';
  const dt = new Date(d+'T00:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}

          <div class="row">
            <div class="field"><label>Ruolo</label>
              <select id="mpRole"><option value="">—</option>${roleOptionsHtml(p.role)}</select>
            </div>
            <div class="field"><label>Sottoruolo</label>
              <select id="mpSubrole">${subroleOptionsHtml(p.role, p.subrole)}</select>
            </div>
          </div>
          <div class="modal-actions">
            <button class="btn btn-ghost" id="modalCancel">Annulla</button>
            <button class="btn btn-accent" id="modalSavePlayer">Salva</button>
          </div>
        </div>
      </div>`;
  } else if(m.type==='match'){
    wrap.innerHTML = `
      <div class="modal-backdrop" id="modalBackdrop">
        <div class="modal">
          <h3>Nuova Partita — Gruppo ${state.matchesGroupTab}</h3>
          <div class="field"><label>Avversario</label><input id="mmOpponent" placeholder="Nome squadra avversaria"></div>
          <div class="field"><label>Data</label><input id="mmDate" type="date"></div>
          <div class="modal-actions">
            <button class="btn btn-ghost" id="modalCancel">Annulla</button>
            <button class="btn btn-accent" id="modalSaveMatch">Crea</button>
          </div>
        </div>
      </div>`;
  } else if(m.type==='confirm'){
    const isStage2 = m.stage===2;
    wrap.innerHTML = `
      <div class="modal-backdrop" id="modalBackdrop">
        <div class="modal">
          <h3>${isStage2? 'Sei sicuro?' : 'Conferma'}</h3>
          <div style="font-size:14px;line-height:1.5;color:var(--ink);">${escapeHtml(isStage2? m.message2 : m.message1)}</div>
          <div class="modal-actions">
            <button class="btn btn-ghost" id="modalCancel">Annulla</button>
            <button class="btn btn-danger" id="modalConfirmNext" style="border-color:var(--red);background:${isStage2?'var(--red)':'transparent'};color:${isStage2?'#fff':'var(--red)'};">${isStage2? 'Sì, elimina definitivamente' : 'Continua'}</button>
          </div>
        </div>
      </div>`;
  }
  root.appendChild(wrap.firstElementChild);
  document.getElementById('modalBackdrop').addEventListener('click', (e)=>{ if(e.target.id==='modalBackdrop'){ state.modal=null; render(); } });
  document.getElementById('modalCancel').onclick = ()=>{ state.modal=null; render(); };
  if(m.type==='player'){
    const roleSel = document.getElementById('mpRole');
    roleSel.onchange = ()=>{
      document.getElementById('mpSubrole').innerHTML = subroleOptionsHtml(roleSel.value, '');
    };
    document.getElementById('modalSavePlayer').onclick = async ()=>{
      const name = document.getElementById('mpName').value.trim();
      const number = document.getElementById('mpNumber').value;
      const group = document.getElementById('mpGroup').value;
      const role = document.getElementById('mpRole').value;
      const subrole = document.getElementById('mpSubrole').value;
      if(!name){ showToast('Inserisci un nome'); return; }
      if(m.player.id){
        const existing = state.roster.find(x=>x.id===m.player.id);
        existing.name = name; existing.number = number? parseInt(number,10):null; existing.group = group;
        existing.role = role; existing.subrole = subrole;
      } else {
        state.roster.push({id:uid(), name, number: number? parseInt(number,10):null, group, role, subrole});
      }
      await saveRoster();
      state.modal = null;
      state.rosterGroupFilter = group;
      render();
    };
  } else if(m.type==='match'){
    document.getElementById('modalSaveMatch').onclick = async ()=>{
      const opponent = document.getElementById('mmOpponent').value.trim();
      const date = document.getElementById('mmDate').value;
      if(!opponent){ showToast("Inserisci l'avversario"); return; }
      const newMatch = {id:uid(), group: state.matchesGroupTab, opponent, date: date || new Date().toISOString().slice(0,10), status:'programmata', ourScore:0, oppScore:0, convocati:[], minutes:{}, goals:[], matchNotes:''};
      state.matches.push(newMatch);
      await saveMatches();
      state.modal = null;
      state.openMatchId = newMatch.id;
      render();
    };
  } else if(m.type==='confirm'){
    document.getElementById('modalConfirmNext').onclick = async ()=>{
      if(m.stage===1){
        state.modal = {...m, stage:2};
        render();
      } else {
        const cb = m.onConfirm;
        state.modal = null;
        render();
        if(cb) await cb();
      }
    };
  }
}

/* ---------- Event delegation for content ---------- */
function attachContentHandlers(){
  const main = document.getElementById('mainContent');
  if(!main) return;

  // Rosa
  main.querySelectorAll('[data-group-filter]').forEach(b=> b.onclick = ()=>{ state.rosterGroupFilter = b.dataset.groupFilter; render(); });
  const addPlayerBtn = document.getElementById('addPlayerBtn');
  if(addPlayerBtn) addPlayerBtn.onclick = ()=> openPlayerModal(null);
  main.querySelectorAll('[data-edit-player]').forEach(b=> b.onclick = ()=>{
    const p = state.roster.find(x=>x.id===b.dataset.editPlayer);
    openPlayerModal(p);
  });
  main.querySelectorAll('[data-unassign-player]').forEach(b=> b.onclick = async ()=>{
    const p = state.roster.find(x=>x.id===b.dataset.unassignPlayer);
    if(!p) return;
    p.group = '';
    await saveRoster();
    showToast(`${p.name} spostato in Non assegnati`);
    render();
  });
  main.querySelectorAll('[data-del-player]').forEach(b=> b.onclick = ()=>{
    const p = state.roster.find(x=>x.id===b.dataset.delPlayer);
    const pid = b.dataset.delPlayer;
    askDoubleConfirm(
      `Eliminare definitivamente ${p? p.name : 'questo giocatore'} dalla rosa?`,
      `Questa azione non si può annullare: ${p? p.name : 'il giocatore'} verrà cancellato del tutto, incluso il suo storico partite. Se vuoi solo toglierlo da un gruppo, usa "Togli dal gruppo" invece.`,
      async ()=>{
        state.roster = state.roster.filter(x=>x.id!==pid);
        await saveRoster();
        render();
      }
    );
  });
  main.querySelectorAll('[data-set-group]').forEach(b=> b.onclick = async ()=>{
    const [pid, targetGroup] = b.dataset.setGroup.split('|');
    const p = state.roster.find(x=>x.id===pid);
    if(!p) return;
    p.group = targetGroup;
    await saveRoster();
    showToast(`${p.name} assegnato al gruppo ${targetGroup}`);
    render();
  });

  // Partite list
  main.querySelectorAll('[data-matches-group]').forEach(b=> b.onclick = ()=>{ state.matchesGroupTab = b.dataset.matchesGroup; render(); });
  const addMatchBtn = document.getElementById('addMatchBtn');
  if(addMatchBtn) addMatchBtn.onclick = ()=>{ state.modal = {type:'match'}; render(); };
  main.querySelectorAll('[data-open-match]').forEach(b=> b.onclick = ()=>{ state.openMatchId = b.dataset.openMatch; render(); });

  // Match detail
  const backLink = document.getElementById('backToMatches');
  if(backLink) backLink.onclick = ()=>{ state.openMatchId=null; render(); };
  const delMatchBtn = document.getElementById('deleteMatchBtn');
  if(delMatchBtn) delMatchBtn.onclick = ()=>{
    const matchId = state.openMatchId;
    askDoubleConfirm(
      'Eliminare questa partita e tutti i suoi dati (convocati, minuti, gol, note)?',
      'Questa azione non si può annullare. Tutti i dati di questa partita andranno persi definitivamente.',
      async ()=>{
        state.matches = state.matches.filter(m=>m.id!==matchId);
        await saveMatches();
        state.openMatchId = null;
        render();
      }
    );
  };
  main.querySelectorAll('[data-score]').forEach(inp=> inp.onchange = async ()=>{
    const m = state.matches.find(x=>x.id===state.openMatchId);
    if(inp.dataset.score==='our') m.ourScore = parseInt(inp.value,10)||0;
    else m.oppScore = parseInt(inp.value,10)||0;
    await saveMatches();
  });
  const statusSel = document.getElementById('matchStatus');
  if(statusSel) statusSel.onchange = async ()=>{
    const m = state.matches.find(x=>x.id===state.openMatchId);
    m.status = statusSel.value;
    await saveMatches();
    render();
  };
  main.querySelectorAll('[data-min-input]').forEach(inp=> inp.onchange = ()=> setPlayerMinutes(state.openMatchId, inp.dataset.minInput, inp.value));
  main.querySelectorAll('[data-add-goal]').forEach(b=> b.onclick = ()=> addGoal(state.openMatchId, b.dataset.addGoal));
  main.querySelectorAll('[data-remove-goal]').forEach(b=> b.onclick = ()=> removeGoal(state.openMatchId, b.dataset.removeGoal));
  main.querySelectorAll('[data-goal-minute]').forEach(inp=> inp.onchange = ()=> setGoalMinute(state.openMatchId, inp.dataset.goalMinute, inp.value));
  main.querySelectorAll('[data-toggle-convoc]').forEach(b=> b.onclick = async ()=>{
    const m = state.matches.find(x=>x.id===state.openMatchId);
    if(!m.convocati) m.convocati=[];
    m.convocati.push(b.dataset.toggleConvoc);
    await saveMatches();
    render();
  });
  main.querySelectorAll('[data-remove-convoc]').forEach(b=> b.onclick = async ()=>{
    const m = state.matches.find(x=>x.id===state.openMatchId);
    if(!m.convocati) return;
    m.convocati = m.convocati.filter(id=>id!==b.dataset.removeConvoc);
    await saveMatches();
    render();
  });
  const saveMatchNotesBtn = document.getElementById('saveMatchNotesBtn');
  if(saveMatchNotesBtn) saveMatchNotesBtn.onclick = async ()=>{
    const m = state.matches.find(x=>x.id===state.openMatchId);
    m.matchNotes = document.getElementById('matchNotes').value;
    await saveMatches();
    showToast('Note salvate');
  };

  // Stats
  main.querySelectorAll('[data-toggle-stat]').forEach(b=> b.onclick = ()=>{
    state.expandedStatPlayer = state.expandedStatPlayer === b.dataset.toggleStat ? null : b.dataset.toggleStat;
    render();
  });
}

checkAuth();
</script>
</body>
</html>
